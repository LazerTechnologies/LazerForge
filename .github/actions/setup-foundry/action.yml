name: Setup Foundry
description: Install Foundry, restore Soldeer and Forge caches, and install dependencies

inputs:
  cache-artifacts:
    description: Cache Forge's out/ and cache/ directories in addition to Soldeer dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # pinned rather than `nightly` so CI matches the reproducible-build claim
        version: v1.7.1
        # caches ~/.foundry/cache (RPC/Etherscan). Dependency and artifact
        # caches below are separate — this action does not cover those.
        cache: true

    # Soldeer writes into gitignored `dependencies/`. Keyed on the lockfile so
    # a cache hit skips re-fetching OpenZeppelin, Solady, and the Uniswap
    # packages. Shared across jobs and workflows.
    - name: Cache Soldeer dependencies
      uses: actions/cache@v4
      with:
        path: dependencies
        key: soldeer-${{ runner.os }}-${{ hashFiles('soldeer.lock', 'foundry.toml') }}
        restore-keys: |
          soldeer-${{ runner.os }}-

    # Compiler artifacts are profile-specific (coverage compiles with the
    # optimizer off). Include FOUNDRY_PROFILE in the key so jobs don't clobber
    # each other.
    - name: Cache Forge artifacts
      if: ${{ inputs.cache-artifacts == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          cache
          out
        key: forge-${{ runner.os }}-${{ env.FOUNDRY_PROFILE || 'default' }}-${{ hashFiles('soldeer.lock', 'foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol') }}

    - name: Install dependencies
      shell: bash
      run: forge soldeer install
