name: Forge Tests

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]

# matches the [profile.ci] section in foundry.toml (profile names are case-sensitive)
env:
  FOUNDRY_PROFILE: ci

permissions:
  contents: read

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      - name: Run Forge build
        id: build
        run: |
          forge --version
          forge build

      # Size regressions don't fail CI while example contracts still live in
      # src/ (see #30). Revisit this once that issue lands. Compile errors are
      # already gated by the build step above.
      - name: Check contract sizes
        run: forge build --sizes
        continue-on-error: true

      - name: Run Forge tests
        id: test
        run: forge test -vvv

  gas:
    name: Gas snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      # Fuzz and invariant tests are excluded: their gas depends on random
      # inputs, so they cannot gate PRs. Update the committed snapshot with
      # the same filter after a gas-affecting change.
      - name: Check gas snapshot
        run: forge snapshot --check --nmt 'test_fuzz|testFuzz|invariant'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # [profile.coverage] turns the optimizer off; high optimizer_runs
      # destroys the source maps coverage needs.
      FOUNDRY_PROFILE: coverage
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      - name: Generate coverage report
        run: forge coverage --report summary --report lcov --exclude-tests

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
