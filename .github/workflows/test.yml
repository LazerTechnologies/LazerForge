name: Forge Tests

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]

# matches the [profile.ci] section in foundry.toml (profile names are case-sensitive)
env:
  FOUNDRY_PROFILE: ci

permissions:
  contents: read

jobs:
  check:
    # Keep this name — the main branch ruleset requires the "Forge Tests" context.
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      - name: Run Forge build
        id: build
        run: |
          forge --version
          forge build

      - name: Check contract sizes
        run: forge build --sizes

      - name: Run Forge tests
        id: test
        run: forge test -vvv

  # variant:full:start
  examples:
    name: Examples
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: examples
      # A job-level profile replaces `ci`, so [profile.ci.fuzz] no longer applies
      # here - and the repo's only fuzz tests are in examples/. Set the campaign
      # size directly so CI keeps running it at full depth.
      FOUNDRY_FUZZ_RUNS: 1024
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      # the contracts big enough to approach the 24KB limit all live here, so
      # this is where the size check earns its keep
      - name: Build examples
        run: forge build --sizes

      - name: Test examples
        run: forge test -vvv

  gas:
    name: Gas snapshot
    runs-on: ubuntu-latest
    env:
      # Snapshot the example contracts — Counter gas is not interesting.
      FOUNDRY_PROFILE: examples
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      # Fuzz and invariant tests are excluded: their gas depends on random
      # inputs, so they cannot gate PRs. Update the committed snapshot with
      # the same filter after a gas-affecting change.
      - name: Check gas snapshot
        run: forge snapshot --check --nmt 'test_fuzz|testFuzz|invariant'
  # variant:full:end

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # [profile.coverage] turns the optimizer off; high optimizer_runs
      # destroys the source maps coverage needs. Cover src/ (Counter / user
      # code). Example coverage: FOUNDRY_PROFILE=examples with optimizer off.
      FOUNDRY_PROFILE: coverage
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-foundry

      - name: Generate coverage report
        run: forge coverage --report summary --report lcov --exclude-tests

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
