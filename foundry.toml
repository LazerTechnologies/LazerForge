[profile.default]
# update solc values if needed for compatability with older contracts
auto_detect_solc = false
solc = '0.8.36'
# pin the EVM version explicitly rather than inheriting whatever the installed
# forge version defaults to, so builds stay reproducible across toolchains
evm_version = 'prague'
src = "src"
out = "out"
libs = ["dependencies"]
# Resolve imports only through the explicit list below. Left on, forge also infers
# remappings by walking `dependencies/`, which picks up the empty submodule stubs
# inside the Uniswap v4 checkouts and shadows the real packages.
auto_detect_remappings = false
# Dependencies live in `dependencies/<name>-<version>/`, so these paths carry the
# version. Bump them alongside the matching entry in [dependencies] below.
remappings = [
    'forge-std/=dependencies/forge-std-1.16.2/src/',
    'solady/=dependencies/solady-0.1.26/src/',
    # The published @openzeppelin-contracts package is flattened - the contracts sit
    # at the package root, not under a contracts/ subdirectory like the git repo.
    # `@openzeppelin/contracts/` is the canonical upstream spelling and what this
    # repo's own imports use. The bare `openzeppelin/contracts/` alias is kept as a
    # convenience for template users and is not used by any code here.
    '@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/',
    'openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/',
]
# ensure that block number + timestamp are realistic when running tests
block_number = 17722462
block_timestamp = 1689711647

# don't pollute bytecode with metadata
bytecode_hash = 'none'
cbor_metadata = false
# grant access to read via_ir-out by default, if necessary
fs_permissions = [{ access = "read", path = "./via_ir-out" }]
# etherscan does not support verifying contracts compiled with more than 10 million
# optimizer runs, so stay under that ceiling. Bytecode is typically unaffected past
# ~1 million runs anyway. Lower this if you are near the 24KB contract size limit.
optimizer = true
optimizer_runs = 9_999_999

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${ETHEREUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# every network with an [rpc_endpoints] entry needs a matching entry here to verify
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }
anvil = { key = "" }

# via_ir pipeline is very slow - use a separate profile to pre-compile and then use vm.getCode to deploy
[profile.via_ir]
via_ir = true
# do not compile tests when compiling via-ir
test = 'src'
out = 'via_ir-out'

# offload bulk of fuzz runs to CI
# NOTE: profile names are matched case-sensitively, keep this lowercase to match
# the FOUNDRY_PROFILE value set by the GitHub Actions workflows
[profile.ci.fuzz]
runs = 1024

# forge coverage instruments source maps. The default optimizer_runs (9_999_999)
# mangles those maps and produces empty or misleading reports, so this profile
# turns the optimizer off. `just cov` and the CI coverage job set
# FOUNDRY_PROFILE=coverage for you.
[profile.coverage]
optimizer = false
via_ir = false

# Coverage cares about hitting lines, not about fuzz depth. Keep this small so
# `forge coverage` stays fast locally and in CI.
[profile.coverage.fuzz]
runs = 16

[profile.ffi]
ffi = true
test = 'test-ffi'
fs_permissions = [{ access = 'read-write', path = './test-ffi/' }]

# Use a very small number of default fuzz runs to speed up local testing. It is
# recommended to increase this number or use the `--fuzz-runs=256` flag to run
# a proper fuzzing campaign before yeeting your project to mainnet.
[profile.ffi.fuzz]
runs = 5

[profile.gas]
optimizer = true
optimizer_runs = 1000000
via_ir = true

# Local anvil profile - faster compiles for the local iterate/deploy loop
[profile.anvil]
optimizer = true
optimizer_runs = 500_000

# paste an anvil-generated account here
# sender = "0x..."

# Testing knobs for local chain realism and speed
[profile.anvil.fuzz]
runs = 64

# NOTE: there is no broadcast-retry config key. `broadcast` is a path string (the
# output directory), so it cannot take a table. Verification attempts are tuned with
# CLI flags instead:
#   forge script script/Deploy.s.sol --rpc-url anvil --broadcast --retries 10 --delay 5

# If you use forked anvil often, set a default fork here (optional)
# [profile.anvil.rpc_storage_caching]
# chains = ["anvil"]

# Extra IO permissions for local scripts. `fs_permissions` is an array of tables and
# fully replaces the default profile's value, so repeat any entries you still need:
# fs_permissions = [
#     { access = "read", path = "./via_ir-out" },
#     { access = "read-write", path = "./broadcast" },
# ]

# Gas reporting locally (optional). `gas_reports` is an array of contract names:
# gas_reports = ["MyContract", "AnotherContract"]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[soldeer]
# Remappings are maintained by hand in [profile.default] above so the template can
# keep its import aliases (`@openzeppelin/contracts/`, `openzeppelin/contracts/`,
# ...). Letting Soldeer generate them would overwrite that list with one entry per
# dependency and break every existing import.
remappings_generate = false

# Managed with `forge soldeer`. Add with `forge soldeer install <name>~<version>`,
# drop with `forge soldeer uninstall <name>`, then update the remappings above.
# Exact versions and content hashes are recorded in soldeer.lock.
[dependencies]
forge-std = "1.16.2"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.7.0"
